{{- with .Values.openshift.scc }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "standard.name" $ }}-scc-{{ . }}
  labels:
    {{- include "standard.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:{{ . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "standard.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
