{{- $name := include "standard.name" . }}
{{- $probe := dict }}
{{- if .Values.healthCheck }}
{{- $probe = dict "httpGet" (dict "path" .Values.healthCheck "port" "http") }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "standard.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: {{ .Values.strategy }}
  selector:
    matchLabels:
      {{- include "standard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.files .Values.podAnnotations }}
      annotations:
        {{- with .Values.files }}
        checksum/files: {{ toYaml . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "standard.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "standard.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "standard.image" . | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.port .Values.extraPorts }}
          ports:
            {{- with .Values.port }}
            - name: http
              containerPort: {{ . }}
              protocol: TCP
            {{- end }}
            {{- range $portName, $port := .Values.extraPorts }}
            - name: {{ $portName }}
              containerPort: {{ $port }}
              protocol: TCP
            {{- end }}
          {{- end }}
          {{- if or .Values.env .Values.extraEnv }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key | quote }}
              value: {{ $value | toString | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with (.Values.livenessProbe | default $probe) }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with (.Values.readinessProbe | default $probe) }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.files .Values.persistence .Values.extraVolumeMounts }}
          volumeMounts:
            {{- range $path, $_ := .Values.files }}
            - name: files
              mountPath: {{ $path }}
              subPath: {{ include "standard.fileKey" $path }}
              readOnly: true
            {{- end }}
            {{- range $volName, $vol := .Values.persistence }}
            - name: pvc-{{ $volName }}
              mountPath: {{ required (printf "persistence.%s.mountPath is required" $volName) $vol.mountPath }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.files .Values.persistence .Values.extraVolumes }}
      volumes:
        {{- if .Values.files }}
        - name: files
          configMap:
            name: {{ $name }}-files
        {{- end }}
        {{- range $volName, $vol := .Values.persistence }}
        - name: pvc-{{ $volName }}
          persistentVolumeClaim:
            claimName: {{ $vol.existingClaim | default (printf "%s-%s" $name $volName) }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
