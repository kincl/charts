{{- if .Values.openshift.imageStream }}
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: {{ include "standard.name" . }}
  labels:
    {{- include "standard.labels" . | nindent 4 }}
spec:
  lookupPolicy:
    local: false
  tags:
    - from:
        kind: DockerImage
        name: {{ .Values.image | quote }}
      importPolicy:
        importMode: Legacy
      name: {{ include "standard.imageTag" .Values.image | quote }}
      referencePolicy:
        type: Source
{{- end }}
